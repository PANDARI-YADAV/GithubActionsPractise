name: Full Stack CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------
      # BACKEND BUILD
      # ----------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Spring Boot
        working-directory: gitAc
        run: mvn clean package -DskipTests

      # ----------------------------
      # FRONTEND BUILD
      # ----------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Angular Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Angular
        working-directory: frontend
        run: npm run build

      # ----------------------------
      # COPY BACKEND TO EC2
      # ----------------------------

      - name: Copy Backend Jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "gitAc/target/*.jar"
          target: "/home/ubuntu"

      # ----------------------------
      # COPY FRONTEND TO EC2
      # ----------------------------

      - name: Copy Angular Build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend/dist/**"
          target: "/home/ubuntu/frontend"

      # ----------------------------
      # DEPLOY
      # ----------------------------

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "Stopping old Spring Boot application..."

            pkill -f 'java -jar' || true

            sleep 5

            echo "Starting Spring Boot..."

            nohup java -jar /home/ubuntu/*.jar > /home/ubuntu/app.log 2>&1 &

            echo "Deploy Angular"

            sudo rm -rf /var/www/html/*

            sudo cp -r /home/ubuntu/frontend/frontend/dist/* /var/www/html/

            sudo systemctl restart nginx

            echo "Deployment Completed!"
